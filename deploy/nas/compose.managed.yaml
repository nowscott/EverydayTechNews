name: everyday-tech-news-test
services:
  premium:
    image: ${NAS_IMAGE:?versioned image required}
    init: true
    user: "${NAS_UID:-1000}:${NAS_GID:-1001}"
    env_file: ${NAS_ENV_FILE:?private environment required}
    environment:
      TZ: Asia/Shanghai
      NEWS_COLLECTION_PROFILE: nas_balanced
    volumes:
      - ${NAS_DATA_DIR:?private state required}:/data
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
