name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: {node-version: '24'}
      - name: 版本三端同号 + CHANGELOG
        run: node scripts/check-version.mjs
      - name: 空白与冲突标记
        run: |
          git diff --check "origin/${{ github.base_ref }}"...HEAD
          ! git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.lock'
      - name: 泄露与结构检查
        env: {BASE_REF: '${{ github.base_ref }}'}
        run: |
          ! git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- . ':!*.lock'
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n').filter(f => f && !f.includes('node_modules') && /compose.*\.ya?ml$/.test(f));
          const names = new Map();
          for (const path of files) for (const line of readFileSync(path, 'utf8').split('\n')) {
            const m = /^\s*container_name:\s*([A-Za-z0-9_.-]+)/.exec(line);
            if (m) { if (!names.has(m[1])) names.set(m[1], []); names.get(m[1]).push(path); }
          }
          const dup = [...names].filter(([, paths]) => paths.length > 1);
          if (dup.length) { console.log('duplicate container_name:', Object.fromEntries(dup)); process.exit(1); }
          const base = process.env.BASE_REF;
          const added = execFileSync('git', ['diff', '--name-only', '--diff-filter=A', `origin/${base}...HEAD`], { encoding: 'utf8' }).split('\n').filter(Boolean);
          const py = added.filter(p => p.endsWith('.py'));
          if (py.length) { console.log('python files are no longer supported:', py); process.exit(1); }
          console.log('structure checks ok');
          JS
