name: everyday-tech-news-dashboard
services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?pinned dashboard image required}
    init: true
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1001}"
    env_file:
      - path: ${DASHBOARD_ROOT:?dashboard root required}/dashboard.env
        format: raw
    environment:
      TZ: Asia/Shanghai
      DASHBOARD_ORDINARY_DATA: /data/ordinary
      DASHBOARD_PREMIUM_DATA: /data/premium
      DASHBOARD_RUNTIME: /data/runtime
      DASHBOARD_ORDINARY_DEPLOYMENT: /data/ordinary-deployment
      DASHBOARD_PREMIUM_DEPLOYMENT: /data/premium-deployment
    ports:
      - "${DASHBOARD_BIND_IP:?NAS LAN IPv4 required}:${DASHBOARD_PORT:-3080}:3080"
    volumes:
      - ${DASHBOARD_ORDINARY_DATA:?ordinary data required}:/data/ordinary:ro
      - ${DASHBOARD_PREMIUM_DATA:?premium data required}:/data/premium:ro
      - ${DASHBOARD_ROOT}/runtime:/data/runtime:ro
      - ${DASHBOARD_ROOT}/deployment/ordinary:/data/ordinary-deployment:ro
      - ${DASHBOARD_ROOT}/deployment/premium:/data/premium-deployment:ro
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
