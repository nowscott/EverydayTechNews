name: TypeScript engine parity and recovery
on:
  push:
    branches: [main]
    paths:
      - 'packages/news-engine/**'
      - 'experiments/premium/ranking.py'
      - 'experiments/premium/editorial.json'
      - 'experiments/premium/**'
      - 'config/news-filter.json'
      - '.github/workflows/news-engine.yml'
  pull_request:
    paths:
      - 'packages/news-engine/**'
      - 'experiments/premium/ranking.py'
      - 'experiments/premium/editorial.json'
      - 'experiments/premium/**'
      - 'config/news-filter.json'
      - '.github/workflows/news-engine.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/news-engine
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/news-engine/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r ../../requirements.txt
      - run: python -m unittest discover -s ../../tests -v
      - run: npm run typecheck
      - run: npm test
        env:
          PYTHON: python
